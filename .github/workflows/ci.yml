name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Typecheck, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  bots:
    name: Every bot toolkit must be caught
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start the app
        run: |
          npm start > api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:5178/api/health && exit 0; sleep 1; done; exit 1
      - name: Attack it (headful scenarios under a virtual display)
        run: xvfb-run -a npm run bots -- --ci
      - name: Results
        if: always()
        run: cat docs/bot-results.md >> "$GITHUB_STEP_SUMMARY"
      - name: Server log on failure
        if: failure()
        run: tail -100 api.log
